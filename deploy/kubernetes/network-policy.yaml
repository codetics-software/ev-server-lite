# Le serveur Java n’accepte que le mandataire et le tableau de bord. OCPP_TRUSTED_PROXIES
# peut alors viser la plage d’adresses des pods sans exposer les en-têtes de confiance.
# Sans effet si le plugin réseau du cluster n’applique pas les NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: server-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: server
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: edge
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dashboard
      ports:
        - port: 8080
