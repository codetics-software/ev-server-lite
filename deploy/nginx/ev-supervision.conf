# Exemple nginx équivalent au Caddyfile, pour un mandataire existant.
# Remplacer supervision.exemple.fr, ocpp.exemple.fr, les chemins des certificats
# et les adresses amont. Côté serveur Java :
#   OCPP_TRUSTED_PROXIES=<adresse de ce nginx>/32
#   OCPP_CLIENT_CERT_HEADER=X-Client-Cert

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ev_server {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream ev_dashboard {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name supervision.exemple.fr ocpp.exemple.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name supervision.exemple.fr;

    ssl_certificate     /etc/letsencrypt/live/supervision.exemple.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supervision.exemple.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    location ~ ^/(ocpp|ocpi)/ {
        proxy_pass http://ev_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/v1/ {
        client_max_body_size 6m;
        proxy_pass http://ev_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert "";
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://ev_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ocpp.exemple.fr;

    ssl_certificate     /etc/letsencrypt/live/ocpp.exemple.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ocpp.exemple.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Profil 3 uniquement : nginx refuse toute connexion sans certificat valide.
    # Autorités des bornes, plus OCPP_SIGNING_CA_CERTIFICATE si le serveur signe les CSR.
    # Ne jamais utiliser optional_no_ca : le serveur exige un certificat déjà vérifié par le mandataire.
    ssl_client_certificate /etc/nginx/ocpp-client-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 3;

    location /ocpp/ {
        proxy_pass http://ev_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        return 404;
    }
}
