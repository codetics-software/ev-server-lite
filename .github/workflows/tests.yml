name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attribution:
    name: Licence and attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: bash scripts/verify-attribution.sh

  server:
    name: Server (Kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: ev-server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run tests with coverage
        run: ./mvnw -B -ntp test
      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3
        with:
          check_name: Server test results
          report_paths: ev-server/target/surefire-reports/TEST-*.xml
          detailed_summary: true
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('ev-server/target/site/jacoco/jacoco.xml') != '' }}
        working-directory: .
        run: python3 scripts/coverage-summary.py jacoco ev-server/target/site/jacoco/jacoco.xml --name server-coverage --label "server coverage" --output report/badges
      - name: Collect report
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          mkdir -p report/junit report/coverage
          cp ev-server/target/surefire-reports/TEST-*.xml report/junit/ || true
          cp -R ev-server/target/site/jacoco/. report/coverage/ || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: report-server
          path: report
          retention-days: 30

  dashboard:
    name: Web dashboard (Next.js)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: ev-dashboard
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: ev-dashboard/.nvmrc
          cache: npm
          cache-dependency-path: ev-dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:i18n
      - name: Run tests with coverage
        run: npm run test:coverage
      - run: npm run build
      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3
        with:
          check_name: Dashboard test results
          report_paths: ev-dashboard/test-results/junit.xml
          detailed_summary: true
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('ev-dashboard/coverage/coverage-summary.json') != '' }}
        working-directory: .
        run: python3 scripts/coverage-summary.py vitest ev-dashboard/coverage/coverage-summary.json --name dashboard-coverage --label "dashboard coverage" --output report/badges
      - name: Collect report
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          mkdir -p report/junit report/coverage
          cp ev-dashboard/test-results/junit.xml report/junit/ || true
          cp -R ev-dashboard/coverage/. report/coverage/ || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: report-dashboard
          path: report
          retention-days: 30

  android:
    name: Android app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: ev-app-android
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: Run unit tests with coverage
        run: ./gradlew --no-daemon testDebugUnitTest createDebugUnitTestCoverageReport
      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3
        with:
          check_name: Android test results
          report_paths: ev-app-android/app/build/test-results/testDebugUnitTest/TEST-*.xml
          detailed_summary: true
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('ev-app-android/app/build/reports/coverage/test/debug/report.xml') != '' }}
        working-directory: .
        run: python3 scripts/coverage-summary.py jacoco ev-app-android/app/build/reports/coverage/test/debug/report.xml --name android-coverage --label "android coverage" --output report/badges
      - name: Collect report
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          mkdir -p report/junit report/coverage
          cp ev-app-android/app/build/test-results/testDebugUnitTest/TEST-*.xml report/junit/ || true
          cp -R ev-app-android/app/build/reports/coverage/test/debug/. report/coverage/ || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: report-android
          path: report
          retention-days: 30

  ios:
    name: iOS app
    runs-on: macos-26
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: latest-stable
      - name: Pick a simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((name for name in devices if "iOS" in name), reverse=True)
          for runtime in runtimes:
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run unit tests with coverage
        working-directory: ev-app-ios/EV App
        run: |
          set -o pipefail
          xcodebuild test \
            -project "EV App.xcodeproj" \
            -scheme "EV App" \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:"EV AppTests" \
            -parallel-testing-enabled NO \
            -enableCodeCoverage YES \
            -resultBundlePath "$GITHUB_WORKSPACE/build/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --report junit --report-path "$GITHUB_WORKSPACE/build/junit"
      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3
        with:
          check_name: iOS test results
          report_paths: build/junit/*.xml
          detailed_summary: true
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('build/TestResults.xcresult/**') != '' }}
        run: |
          xcrun xccov view --report --json build/TestResults.xcresult > build/coverage.json
          python3 scripts/coverage-summary.py xccov build/coverage.json --name ios-coverage --label "ios coverage" --output report/badges
      - name: Collect report
        if: ${{ !cancelled() }}
        run: |
          mkdir -p report/junit
          cp build/junit/*.xml report/junit/ || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: report-ios
          path: report
          retention-days: 30

  publish:
    name: Publish report and website
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: [attribution, server, dashboard, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: report-*
          path: collected
      - name: Build site
        run: |
          mkdir -p site/images
          cp -R website/. site/
          cp screenshots/02-reseau-ordinateur.png screenshots/04-detail-borne.png site/images/
          python3 scripts/build-test-report.py collected site
          echo "Report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/" >> "$GITHUB_STEP_SUMMARY"
      - name: Check GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not enabled::Open Settings > Pages and set Source to GitHub Actions to publish the test report and the coverage badges."
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: site
      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
