spring:
  application:
    name: ev-supervision-lite
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ev_supervision}
    username: ${DATABASE_USER:ev_supervision}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 12
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
server:
  port: ${PORT:8080}
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 10m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: ${OAUTH_COOKIE_SAME_SITE:none}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs
app:
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  cookie-secure: ${COOKIE_SECURE:true}
  signup-enabled: ${SIGNUP_ENABLED:false}
  public-tenant: ${PUBLIC_TENANT:}
  token-hours: ${SESSION_HOURS:8}
  mail-enabled: ${MAIL_ENABLED:false}
  mail-from: ${MAIL_FROM:noreply@localhost}
  encryption-key: ${APP_ENCRYPTION_KEY:}
  ocpi:
    public-url: ${OCPI_PUBLIC_URL:http://localhost:8080}
    country-code: ${OCPI_COUNTRY_CODE:FR}
    party-id: ${OCPI_PARTY_ID:CDT}
  bootstrap:
    email: ${BOOTSTRAP_EMAIL:}
    password: ${BOOTSTRAP_PASSWORD:}
    tenant: ${BOOTSTRAP_TENANT:codetics}
