spring:
  application:
    name: ev-supervision-lite
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${app.database-url}
    username: ${DATABASE_USER:ev_supervision}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 12
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 10m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: ${OAUTH_COOKIE_SAME_SITE:none}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs
app:
  database-url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ev_supervision}
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  cookie-secure: ${COOKIE_SECURE:true}
  workspace-signup-enabled: ${WORKSPACE_SIGNUP_ENABLED:false}
  keep-alive-url: ${KEEP_ALIVE_URL:}
  stripe:
    api-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  signup-enabled: ${SIGNUP_ENABLED:false}
  public-tenant: ${PUBLIC_TENANT:}
  token-hours: ${SESSION_HOURS:8}
  app-session-days: ${APP_SESSION_DAYS:30}
  mail-enabled: ${MAIL_ENABLED:false}
  mail-from: ${MAIL_FROM:noreply@localhost}
  encryption-key: ${APP_ENCRYPTION_KEY:}
  platform-admin-emails: ${PLATFORM_ADMIN_EMAILS:}
  trusted-proxies: ${APP_TRUSTED_PROXIES:}
  ev-database:
    api-key: ${EV_DATABASE_API_KEY:}
    url: ${EV_DATABASE_URL:https://api.ev-database.org/v1/codetics}
  ocpi:
    public-url: ${OCPI_PUBLIC_URL:http://localhost:8080}
    country-code: ${OCPI_COUNTRY_CODE:FR}
    party-id: ${OCPI_PARTY_ID:COD}
  ocpp:
    trusted-proxies: ${OCPP_TRUSTED_PROXIES:}
    client-cert-header: ${OCPP_CLIENT_CERT_HEADER:}
    client-cert-proxies: ${OCPP_CLIENT_CERT_PROXIES:}
    client-ca: ${OCPP_CLIENT_CA:}
    signing-ca-certificate: ${OCPP_SIGNING_CA_CERTIFICATE:}
    signing-ca-key: ${OCPP_SIGNING_CA_KEY:}
    signed-certificate-days: ${OCPP_SIGNED_CERTIFICATE_DAYS:365}
    allow-unauthenticated: ${OCPP_ALLOW_UNAUTHENTICATED:false}
    heartbeat-seconds: ${OCPP_HEARTBEAT_SECONDS:60}
    public-url: ${OCPP_PUBLIC_URL:}
  bootstrap:
    email: ${BOOTSTRAP_EMAIL:}
    password: ${BOOTSTRAP_PASSWORD:}
    tenant: ${BOOTSTRAP_TENANT:codetics}
  push:
    apns:
      key: ${APNS_KEY:}
      key-id: ${APNS_KEY_ID:}
      team-id: ${APNS_TEAM_ID:}
      topic: ${APNS_TOPIC:}
    fcm:
      service-account: ${FCM_SERVICE_ACCOUNT:}
      project-id: ${FCM_PROJECT_ID:}
  wallet:
    pass-type-id: ${WALLET_PASS_TYPE_ID:}
    team-id: ${WALLET_TEAM_ID:}
    organization-name: ${WALLET_ORGANIZATION_NAME:}
    certificate: ${WALLET_CERTIFICATE:}
    certificate-password: ${WALLET_CERTIFICATE_PASSWORD:}
    wwdr-certificate: ${WALLET_WWDR_CERTIFICATE:}
    nfc-public-key: ${WALLET_NFC_PUBLIC_KEY:}
  google-wallet:
    issuer-id: ${GOOGLE_WALLET_ISSUER_ID:}
    service-account: ${GOOGLE_WALLET_SERVICE_ACCOUNT:}
    class-suffix: ${GOOGLE_WALLET_CLASS_SUFFIX:ev_charging_badge}
    organization-name: ${GOOGLE_WALLET_ORGANIZATION_NAME:}
    smart-tap-redemption-issuer: ${GOOGLE_WALLET_SMART_TAP_REDEMPTION_ISSUER:}
