spring:
  datasource:
    username: sa
    password: ""
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
app:
  database-url: ${DATABASE_URL:jdbc:h2:mem:ev_supervision;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
  cookie-secure: false
server:
  servlet:
    session:
      cookie:
        secure: false
        same-site: lax
